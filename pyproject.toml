[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.0.1"
description = "Tech challenge da fase 3 da postech AI Scientist da FIAP."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.14.0"
dependencies = [
    "ipython>=9.17.1",
    "jupyterlab>=4.6.3",
    "loguru>=0.7.3",
    "matplotlib>=3.11.1",
    "notebook>=7.6.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "ruff>=0.16.6",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tqdm>=4.70.0",
    "typer>=0.27.2",
    "visidata>=3.4",
    "xlrd>=2.0.2",
]


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

